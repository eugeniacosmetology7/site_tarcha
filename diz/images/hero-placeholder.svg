<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C4876A;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#D4956E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A86845;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2C1810;stop-opacity:0.7" />
      <stop offset="60%" style="stop-color:#2C1810;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#2C1810;stop-opacity:0" />
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <ellipse cx="750" cy="380" rx="280" ry="340" fill="rgba(180,120,80,0.3)"/>
  <ellipse cx="780" cy="300" rx="120" ry="140" fill="rgba(200,140,100,0.25)"/>
